map $uri $asset_cache {
    default "no-cache";
    "~^/api/multiplayer/" "no-store";
    /signal "no-store";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/mime.types;
    types { model/gltf-binary glb; }

    add_header Cache-Control $asset_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/multiplayer/readyz {
        access_log off;
        proxy_pass http://127.0.0.1:8081/readyz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_hide_header Cache-Control;
    }
    location /api/multiplayer/ {
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_hide_header Cache-Control;
    }
    location = /signal {
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
    }
    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location / {
        try_files $uri =404;
    }
}
