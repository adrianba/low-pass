# Operator/Ansible example, not the repository's default deployment.
services:
  game:
    image: "${LOW_PASS_IMAGE:?Set the tested application image tag or digest}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 45s
    restart: unless-stopped
    environment:
      LOW_PASS_MULTIPLAYER_ENABLED: "false"
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:?Set the existing Traefik network}"
      traefik.http.routers.low-pass.rule: "Host(`low-pass.biggsea.us`)"
      traefik.http.routers.low-pass.entrypoints: "${TRAEFIK_HTTPS_ENTRYPOINT:?Set the existing HTTPS entrypoint}"
      traefik.http.routers.low-pass.tls: "true"
      traefik.http.routers.low-pass.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:?Set the existing certificate resolver}"
      traefik.http.routers.low-pass.service: low-pass
      traefik.http.services.low-pass.loadbalancer.server.port: "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  coturn:
    image: coturn/coturn:4.18.0-r0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    profiles: [turn]
    # Bypass automatic external-IP discovery and the image's shell argument expansion.
    entrypoint: ["/usr/bin/turnserver"]
    command: ["-c", "/run/secrets/turnserver.conf"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    # Required by the official binary's file capability even on ports above 1024.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65534,gid=65534,mode=0700
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=16m,uid=65534,gid=65534,mode=0700
    volumes:
      - type: bind
        source: "${TURN_CONFIG_FILE:?Set an absolute path to the privately rendered config}"
        target: /run/secrets/turnserver.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${TURN_CERT_DIR:?Set an absolute path to the managed certificate directory}"
        target: /run/coturn-tls
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${TURN_BIND_IP:?Set an IPv4 address owned by the Docker host}:3478:3478/tcp"
      - "${TURN_BIND_IP:?Set an IPv4 address owned by the Docker host}:3478:3478/udp"
      - "${TURN_BIND_IP:?Set an IPv4 address owned by the Docker host}:5349:5349/tcp"
      - "${TURN_BIND_IP:?Set an IPv4 address owned by the Docker host}:49160-49223:49160-49223/udp"
    networks:
      turn:
        ipv4_address: "${TURN_RELAY_IP:?Set a free fixed IPv4 address inside TURN_SUBNET}"
    labels:
      traefik.enable: "false"
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 64
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: "${TRAEFIK_NETWORK:?Set the existing Traefik network}"
  turn:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: "${TURN_SUBNET:?Choose a non-overlapping private IPv4 subnet}"
